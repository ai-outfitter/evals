[project]
name = "evals"
version = "0.1.0"
description = "Declarative, container-based agent evals with judge and human preference recording"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6", "jsonschema>=4"]

[project.scripts]
evals = "evals.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
