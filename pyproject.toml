[project]
name = "evals"
version = "0.1.0"
description = "Declarative, container-based agent evals with judge and human preference recording"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6", "jsonschema>=4"]

[project.scripts]
evals = "evals.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The JSON Schemas are part of the contract the harness enforces, so an
# installed wheel has to carry them. `src/evals/schemas/` is a copy of the
# canonical root `schemas/`; tests/test_packaging.py fails if the two drift.
[tool.setuptools.package-data]
evals = ["schemas/*.json"]
