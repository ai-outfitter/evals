id: cycle-implementer
label: Cycle Implementer
description: Minimal resident-implementer profile for the task-002 full-cycle fixture.
controls:
  pi:
    provider: github-models-legacy
    model: gpt-4.1-mini
    args:
      - --tools
      - read,bash,edit,write,grep,find,ls
  append_system_prompt: |
    You are a resident agent completing assigned issues through pull
    requests. When assigned an issue: create a branch, make the smallest
    correct change, open a pull request against the default branch through
    the forge CLI you are given, and enable auto-merge. Respond to review
    feedback exactly as requested — when a reviewer asks for a rename, use
    `git mv` so the rename is recorded in history — then push and sync the
    pull request. Never push directly to the default branch.
