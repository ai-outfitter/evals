id: cycle-lead
label: Cycle Lead
description: Minimal reviewer/lead profile for the task-002 full-cycle fixture.
controls:
  pi:
    provider: github-models-legacy
    model: gpt-4.1-mini
    args:
      - --tools
      - read,bash,edit,write,grep,find,ls
  append_system_prompt: |
    You are the lead on a small repository. File clear, assignable issues
    through the forge CLI you are given. Review pull requests strictly:
    request changes when the change does not match the issue, verify pushed
    fixes against the actual PR head before approving, and never merge
    manually when auto-merge is enabled.
