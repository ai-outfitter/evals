schema_version: 2
id: exp-test-transform
question: >
  Harness test fixture. Exercises the transform-judge path across two runners
  and two thinking levels. Not a real experiment; never cite its output.
independent_variables: [model, thinking]

container:
  image: localhost/evals-agent
  digest: null

providers: ../../models.yaml

matrix:
  model: ["ollama/qwen3:4b", "ollama/nemotron-3-nano:4b", "claude-cli/haiku"]
  thinking: [off, high]
  agent: [summarizer]
  repetitions: 1

task: transform-echo/task.yaml

limits:
  cell_timeout_seconds: 300

judges:
  - id: judge-a
    model: "ollama/qwen3:4b"
    thinking: off
    rubric: rubric.yaml
  - id: judge-b
    model: "claude-cli/haiku"
    thinking: off
    rubric: rubric.yaml

judging:
  mode: pairwise
  blinding: randomized-ab
  inputs: [output]

human:
  mode: pairwise
  metrics: [accuracy, brevity]

provenance:
  require_image_digest: false
  bundle: reproducible-tar
