# Provider registry. Rendered into a Pi models.json per cell; the container
# variant swaps base_url for base_url_container (agent runs with --network host,
# so both currently resolve the same hosts).
providers:
  ollama:
    api: openai-completions
    base_url: http://ncrmro-workstation:11434/v1
    base_url_container: http://ncrmro-workstation:11434/v1
    api_key:
      literal: ollama
    compat:
      supportsDeveloperRole: false
      supportsReasoningEffort: false
    models:
      - id: qwen3:32b
        name: Qwen3 32B (Ollama)
        reasoning: true
        context_window: 65536
        max_tokens: 8192
      - id: qwen3:4b
        name: Qwen3 4B (Ollama)
        reasoning: true
        context_window: 65536
        max_tokens: 8192
      - id: qwen3:0.6b
        name: Qwen3 0.6B (Ollama, smoke)
        reasoning: true
        context_window: 32768
        max_tokens: 4096
      - id: nemotron-3-nano:4b
        name: Nemotron 3 Nano 4B (Ollama)
        reasoning: true
        context_window: 65536
        max_tokens: 8192
  # Claude Code CLI on the host. It authenticates from the user's own session
  # and is not in the agent image, so these cells run outside the container
  # boundary: provider diversity in exchange for weaker isolation. Thinking
  # maps to MAX_THINKING_TOKENS.
  claude-cli:
    runner: claude-cli
    models:
      - id: haiku
        name: Claude Haiku (claude -p)
        reasoning: true
        context_window: 200000
        max_tokens: 8192
  github-models-legacy:
    api: openai-completions
    base_url: https://models.inference.ai.azure.com
    api_key:
      env: GITHUB_TOKEN
    compat:
      supportsDeveloperRole: false
      supportsReasoningEffort: false
    models:
      - id: gpt-4.1-mini
        name: GPT-4.1 mini (GitHub Models legacy)
        reasoning: false
        context_window: 128000
        max_tokens: 8192
